<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNIQ SAFETY DATABASE</title>
    <link rel="stylesheet" href="style.css?v=4.2.0">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@100;200;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div id="lock-screen">
        <div class="lock-content">
            <img src="Logo.png" alt="UNIQ Logo" class="lock-logo">
            <h2>SAFETY DATABASE</h2>
            <p>กรุณาใส่รหัสผ่านเพื่อเข้าใช้งาน</p>
            <div class="passcode-wrapper">
                <input type="password" id="passcodeInput" placeholder="PASSCODE" maxlength="6" autofocus>
                <button onclick="checkPasscode()" class="spacex-btn">UNLOCK SYSTEM</button>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <img src="Logo.png" alt="UNIQ Logo" class="nav-logo">
            <div class="nav-menu">
                <a href="download.html">DOWNLOADS</a>
            </div>
        </div>
    </nav>

    <header class="hero-section">
        <img src="rodfai.jpg" class="hero-bg" alt="Red Line Project">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h2 class="sub-title">UNIQUE ENGINEERING</h2>
            <h1 class="main-title">RED LINE PROJECT</h1>
            <p class="project-desc">SAFETY PERSONNEL DATABASE SYSTEM</p>
            
            <div class="search-box-wrapper">
                <input type="text" id="searchInput" placeholder="ENTER NAME OR ID" class="spacex-input" autocomplete="off">
                <button onclick="searchWorker()" class="spacex-btn">SEARCH</button>
            </div>
        </div>
    </header>

    <main class="main-area">
        <div class="container">
            
            <div class="filter-container">
                <div class="filter-group">
                    <p class="group-label">OPERATIONAL AREA (พื้นที่การทำงาน)</p>
                    <div class="button-row">
                        <button class="filter-btn area-btn" onclick="filterArea('Station B')">สายสีม่วง</button>
                        <button class="filter-btn area-btn" onclick="filterArea('Depot')">บ้านไผ่-นครพนม</button>
                        <button class="filter-btn area-btn" onclick="filterArea('Tunnel')">พระราม3</button>
                    </div>
                </div>

                <div class="filter-group">
                    <p class="group-label">ORGANIZATION TEAM (สังกัดทีม)</p>
                    <div class="button-row">
                        <button class="filter-btn team-btn" onclick="filterTeam('Safety')">SAFETY</button>
                        <button class="filter-btn team-btn" onclick="filterTeam('TBM')">TBM</button>
                        <button class="filter-btn team-btn" onclick="filterTeam('Station')">STATION</button>
                        <button class="filter-btn team-btn" onclick="filterTeam('QC')">QC</button>
                    </div>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #222; margin: 40px 0;">

            <div id="workerList">
                </div>

        </div>
    </main>

    <script src="app.js?v=4.2.0"></script>
</body>
</html>
